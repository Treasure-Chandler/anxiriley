<!DOCTYPE html>
<html lang="en" translate="no">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Class Details</title>

		<script src="../scripts/lib/firebase-app-compat.js"></script>
		<script src="../scripts/lib/firebase-auth-compat.js"></script>
		<script src="../scripts/lib/firebase-firestore-compat.js"></script>
		<script src="../scripts/firebase-init.js"></script>
		<script type="module" src="../scripts/classPage.js"></script>

		<link rel="stylesheet" href="../styles/classPage.css">
		<link rel="icon" href="../assets/anxirileyicon.png">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
	</head>
	<body>
		<main class="class-page">
			<button class="back-button" id="back" type="button" aria-label="Back to home"></button>
			<p class="class-status" id="classStatus" role="status">Loading class...</p>
			<article class="class-detail" id="classDetail" hidden>
				<img class="class-banner" id="classBanner" alt="">
				<div class="class-content">
					<p class="class-hour" id="classHour"></p>
					<h1 id="classTitle"></h1>
					<p class="teacher-name" id="teacherName"></p>
					<p class="class-code" id="classCode"></p>
				</div>
			</article>
		</main>
	</body>
</html>
