<!--
    Made by Treasure Chandler

    The main home page for Anxiriley, which includes Firestore integration for loading class data,
    along with all of the other main features of the extension.
-->

<!DOCTYPE html>
<html lang="en" translate="no">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>

        <!-- Firebase setup -->
        <script src="../scripts/lib/firebase-app-compat.js"></script>
        <script src="../scripts/lib/firebase-auth-compat.js"></script>
        <script src="../scripts/lib/firebase-firestore-compat.js"></script>
        <script src="../scripts/firebase-init.js"></script>

        <script src="../scripts/home.js"></script>

        <link rel="stylesheet" href="../styles/home.css">
        <link rel="icon" href="../assets/anxirileyicon.png">
        
        <!-- "Poppins" font from Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    </head>
    <body>
        <main>
            <!-- Settings button -->
            <button class="settings-btn" id="settings"></button>

            <!-- Inbox and add class buttons -->
            <div class="xtra-btns">
                <button id="inbox"></button>
                <button id="classAdd"></button>
            </div>

            <!-- Home universal alert template-->
            <dialog closedby="closerequest" class="create-class-alert" id="universalCCAlert">
                <h2 id="universalCCAlertTitle"></h2>
                <p id="universalCCAlertMessage"></p>
                <button class="ok" id="universalCCAlertOK">OK</button>
            </dialog>

            <!-- Class code popup when a teacher creates a class -->
            <dialog closedby="closerequest" class="create-class-alert" id="latestClassCodeBox" style="align-items: center; text-align: center;">
                <h1 style="font-size: 40px; margin-bottom: -15px; margin-top: 5px; text-align: center;">Your Class Code Is:</h1>
                <p id="latestClassCode" style="font-size: 28px; text-align: center; text-decoration: underline;">N/A</p>
                <p style="font-size: 16px; max-width: 350px; margin-left: auto; margin-right: auto; margin-top: -15px; text-align: center; ">
                    It is best to save this code so you can share it with your students.
                    This code will also be displayed on your class page, so it will be available 24/7.
                </p>
                <p style="color: #44b7c4; font-size: 16px; max-width: 350px; margin-left: auto; margin-right: auto; margin-top: -5px; text-align: center; ">
                    If you don't see your new class, you may need to refresh the page in order for changes
                    to take effect.
                </p>
                <button class="latestClassCodeOK" id="latestClassCodeOK" style="margin-bottom: 5px;">OK</button>
            </dialog>

            <!-- 3 menu buttons -->
            <footer>
                <img src="/assets/homeselected.png" width="120" height="120" id="home">
                <button id="calmDown"></button>
                <button id="stats"></button>
            </footer>     
        </main>
    </body>
</html>
